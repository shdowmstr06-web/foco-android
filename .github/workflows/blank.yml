name: Build Foco APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Foco-Android-con-workflow.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer proyecto Android
        run: unzip -o Foco-Android-con-workflow.zip -d .

      - name: Compilar APK
        run: gradle --no-daemon -p Foco-Android assembleDebug

      - name: Guardar APK generado
        uses: actions/upload-artifact@v4
        with:
          name: Foco-Android-debug-APK
          path: Foco-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
